name: 🔖 Release Tag

on:
  workflow_run:
    workflows: ["💡Fingerprints Update"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

jobs:
  release:
    # A workflow_run start is accepted only from a successful scheduled or
    # manual run of the update workflow on main of this repository.
    if: >-
      github.event_name != 'workflow_run' || (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.path == '.github/workflows/fingerprint-update.yml' &&
        (github.event.workflow_run.event == 'schedule' || github.event.workflow_run.event == 'workflow_dispatch')
      )
    uses: projectdiscovery/workflows/.github/workflows/auto-release.yaml@aff1fb3353633181a1363087e0a40d1124b13d64 # v1.0.0
    permissions:
      contents: write
